<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오리온 용어 나무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B3</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --yellow:#FEE500;
    --yellow-dark:#F5D900;
    --on-yellow:#3C1E1E;
    --ink:#3C1E1E;
    --ink-soft:#664242;
    --ink-faint:#9C8181;
    --room-bg:#ABC4D6;
    --room-bg2:#B7CFDF;
    --app-bg:#DDE3E8;
    --surface:#FFFFFF;
    --surface-2:#F7F7F7;
    --input-bg:#F2F2F2;
    --border:#E4E4E4;
    --danger:#D0492A;
    --success:#2E9E5B;
    --extra-bg:#FFF6D9;
    --extra-label-ink:#A8860A;
    --link-ink:#8A8A8A;
    --select-bg:#F7F7F7;
    --select-border:#ECECEC;
    --select-hover:#EFEFEF;
    --select-viewed-bg:#FFFDF0;
    --select-request-border:#C9C2A8;
    --select-request-ink:#8A8578;
    --time-ink:#5B6B78;
    --shadow:0 1px 1px rgba(0,0,0,.05);
    --menu-shadow:0 4px 18px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    font-family:"Noto Sans KR", system-ui, sans-serif;
    color:var(--ink);
    background:var(--app-bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:720px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--room-bg);
    position:relative;
  }
  @media (min-width:760px){
    body{padding:28px 16px;}
    #app{
      min-height:calc(100vh - 56px);
      max-height:calc(100vh - 56px);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,.22);
    }
  }

  header{
    background:var(--yellow);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
    position:sticky;
    top:0;
    z-index:5;
    flex-shrink:0;
  }
  header .avatar{
    width:38px; height:38px; border-radius:11px;
    background:var(--on-yellow);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
  }
  header .titles{flex:1; min-width:0;}
  header h1{font-size:16px; font-weight:700; margin:0; color:var(--on-yellow); font-family:"Noto Serif KR", serif;}
  header .sub{
    font-size:11.5px; color:var(--on-yellow); opacity:.72; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #status{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; color:var(--on-yellow); opacity:.85;
    flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums;
  }
  #status .dot{width:6px; height:6px; border-radius:50%; background:#B7A400; flex-shrink:0;}
  #status.live .dot{background:#2E9E5B;}
  @media (max-width:420px){
    #status span:last-child{display:none;}
  }

  main{
    flex:1; overflow-y:auto;
    padding:16px 12px 20px;
    display:flex; flex-direction:column; gap:2px;
    background:
      radial-gradient(circle at 20% 10%, var(--room-bg2) 0%, transparent 40%),
      var(--room-bg);
  }

  /* ── 말풍선 공통 ── */
  .bot-row{display:flex; align-items:flex-start; gap:8px; margin:10px 0 2px; max-width:88%;}
  .bot-avatar{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:var(--on-yellow); color:var(--yellow);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .bot-col{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .bot-name{font-size:11px; color:var(--ink-soft); margin-left:2px;}
  .bubble-wrap{display:flex; align-items:flex-end; gap:6px;}
  .time{font-size:10px; color:var(--time-ink); white-space:nowrap; flex-shrink:0;}

  .bubble-bot{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;
    padding:10px 13px;
    font-size:14px;
    line-height:1.55;
    box-shadow:var(--shadow);
    max-width:100%;
  }
  .msg-user{
    align-self:flex-end;
    display:flex; align-items:flex-end; gap:6px;
    margin:10px 0 2px; max-width:88%;
  }
  .bubble-user{
    background:var(--yellow);
    color:var(--on-yellow);
    border-radius:14px 4px 14px 14px;
    padding:10px 13px;
    font-size:14px;
    line-height:1.5;
    box-shadow:var(--shadow);
  }

  /* ── 웰컴 메시지 ── */
  .welcome-bubble{max-width:320px; white-space:pre-line; font-size:13.5px; line-height:1.65;}

  /* ── 퀵 액션 버튼 ── */
  .quick-actions{display:flex; flex-wrap:wrap; gap:8px; max-width:320px; margin:2px 0 14px 42px;}
  .quick-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:11px 12px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink);
    cursor:pointer; box-shadow:var(--shadow); text-align:center;
  }
  .quick-btn:hover{background:var(--surface-2);}
  .quick-btn:active{transform:scale(.98);}
  @media (max-width:420px){ .quick-actions{margin-left:0; max-width:100%;} }

  /* ── 용어 카드(리치 메시지) ── */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    width:100%;
    max-width:320px;
  }
  .card .cat-tag{
    display:inline-block; font-size:10.5px; font-weight:700; color:var(--on-yellow);
    background:var(--yellow); padding:3px 9px; border-radius:0 0 8px 0;
    white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:top;
  }
  .card .body{padding:12px 14px 14px;}
  .card .term{font-size:16.5px; font-weight:700; margin:6px 0 5px; color:var(--ink); font-family:"Noto Serif KR", serif;}
  .card .def{font-size:13.5px; line-height:1.55; color:var(--ink); margin:0 0 9px; white-space:pre-line;}
  .term-img{
    display:block; width:100%; max-height:220px; object-fit:contain;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    margin:0 0 10px; cursor:zoom-in;
  }
  #lightbox{
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.82);
    display:none; align-items:center; justify-content:center; padding:16px; cursor:zoom-out;
  }
  #lightbox.show{display:flex;}
  #lightbox img{display:block; max-width:94vw; max-height:90vh; max-height:90dvh; object-fit:contain; border-radius:8px; background:#fff;}
  .lb-inner{position:relative; display:inline-block; max-width:94vw;}
  .lb-close{
    position:absolute; top:8px; right:8px; width:40px; height:40px; padding:0;
    border:none; border-radius:50%; background:rgba(0,0,0,.6); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .lb-close:hover{background:rgba(0,0,0,.8);}
  .lb-close:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .extra-box{
    background:var(--extra-bg); border-left:3px solid var(--yellow-dark); border-radius:4px;
    padding:8px 10px; margin:0 0 10px; font-size:12.5px; line-height:1.6;
    color:var(--ink-soft); white-space:pre-line;
  }
  .extra-box .extra-label{display:block; font-size:10.5px; font-weight:700; color:var(--extra-label-ink); margin-bottom:3px;}
  .request-link{
    background:none; border:none; padding:0; font-size:11.5px; color:var(--link-ink);
    text-decoration:underline; cursor:pointer; font-family:inherit;
  }
  .request-link:hover{color:var(--ink-soft);}
  .rate-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin:2px 0 10px; font-size:11.5px; color:var(--link-ink);}
  .rate-btn{
    width:44px; height:34px; border:1px solid var(--select-border); border-radius:999px; background:var(--surface-2);
    font-size:15px; line-height:1; cursor:pointer; padding:0;
  }
  .rate-btn:hover{background:var(--select-hover);}
  .rate-thanks{color:var(--ink-soft);}
  .rate-fix{
    border:none; background:none; padding:0; font-family:inherit; font-size:11.5px; color:var(--ink-soft);
    text-decoration:underline; cursor:pointer;
  }
  .btn-request{
    background:var(--yellow); color:var(--on-yellow); border:none; border-radius:18px;
    padding:9px 16px; font-family:inherit; font-weight:700; font-size:12.5px;
    cursor:pointer; align-self:flex-start;
  }
  .btn-request:hover{background:var(--yellow-dark);}

  /* ── 선택지 목록 (여러 후보 / TOP5 / 최신 / 카테고리) ── */
  .select-bubble{
    display:flex; flex-direction:column; gap:8px; max-width:320px; min-width:210px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:4px 14px 14px 14px; padding:10px 12px; box-shadow:var(--shadow);
  }
  .select-prompt{margin:0; font-size:14px;}
  .select-list{display:flex; flex-direction:column; gap:6px;}
  .select-item{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 8px;
    background:var(--select-bg); border:1px solid var(--select-border); border-radius:9px;
    padding:9px 12px; font-family:inherit; font-size:13px; font-weight:500; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .select-item:hover{background:var(--select-hover);}
  .select-item.viewed{border-color:var(--yellow-dark); background:var(--select-viewed-bg);}
  .select-item .select-cat{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--yellow);
    padding:2px 7px; border-radius:8px; flex:0 0 auto; white-space:nowrap; margin-left:auto;
  }
  .select-item > span:first-child{flex:1 1 auto; min-width:0; overflow-wrap:anywhere;}
  .select-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .select-toggle{
    flex:none; border:1px solid var(--select-border); background:var(--surface);
    border-radius:999px; font-family:inherit; font-size:11px; font-weight:700;
    padding:3px 9px; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .select-toggle:hover{background:var(--select-hover);}
  .select-list.collapsed{display:none;}
  .select-more{
    background:#fff; border:1px dashed var(--select-request-border); color:var(--select-request-ink);
    border-radius:9px; padding:9px 12px; font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer; text-align:center;
  }
  .select-more:hover{background:#FBFAF5;}
  .jump-latest{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(76px + env(safe-area-inset-bottom)); z-index:8; display:none;
    min-height:40px; padding:0 18px; border:none; border-radius:999px;
    background:var(--yellow); color:var(--on-yellow);
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .jump-latest.show{display:block;}
  .jump-latest:hover{background:var(--yellow-dark);}
  body.menu-open .jump-latest{display:none;}
  @media (min-width:760px){ .jump-latest{bottom:104px;} }
  .select-item-request{
    background:#fff; border:1px dashed var(--select-request-border); color:var(--select-request-ink);
    justify-content:center;
  }
  .select-item-request:hover{background:#FBFAF5;}
  .bubble-bot.pre{white-space:pre-line;}
  .compare-card{
    background:var(--surface); border:1px solid var(--border); border-radius:4px 14px 14px 14px;
    box-shadow:var(--shadow); width:100%; max-width:320px; overflow:hidden;
  }
  .compare-head{padding:10px 14px; font-size:13.5px; font-weight:700; color:var(--ink); background:var(--select-viewed-bg); border-bottom:1px solid var(--border);}
  .compare-row{padding:11px 14px;}
  .compare-row + .compare-row{border-top:1px solid var(--border);}
  .compare-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:3px;}
  .compare-term{font-family:"Noto Serif KR", serif; font-weight:700; font-size:14.5px; color:var(--ink); overflow-wrap:anywhere;}
  .compare-cat{font-size:10px; font-weight:700; color:var(--ink-soft); background:var(--yellow); padding:1px 7px; border-radius:8px; white-space:nowrap;}
  .compare-def{
    margin:0 0 4px; font-size:12.5px; line-height:1.5; color:var(--ink); white-space:pre-line;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .compare-more{border:none; background:none; padding:0; font-family:inherit; font-size:11.5px; color:var(--link-ink); text-decoration:underline; cursor:pointer;}
  .compare-more:hover{color:var(--ink-soft);}
  .no-match-wrap{
    display:flex; flex-direction:column; gap:10px; align-items:flex-start; padding:11px 14px; max-width:300px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:4px 14px 14px 14px; box-shadow:var(--shadow);
  }

  /* ── 피드백 폼 카드 ── */
  .feedback-card{
    background:var(--surface); padding:14px 16px; width:100%; max-width:300px;
    border:1px solid var(--border); border-radius:4px 14px 14px 14px; box-shadow:var(--shadow);
  }
  .feedback-card h3{font-size:14px; font-weight:700; margin:0 0 8px; color:var(--ink);}
  .feedback-card label{display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin:9px 0 4px;}
  .feedback-card input, .feedback-card textarea{
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-family:inherit; font-size:13px;
    resize:vertical; background:var(--input-bg); color:var(--ink);
  }
  .feedback-card input:focus, .feedback-card textarea:focus{outline:2px solid var(--yellow-dark); outline-offset:1px;}
  .feedback-card textarea{min-height:60px;}
  .feedback-actions{display:flex; gap:8px; margin-top:11px;}
  .btn-cancel{
    background:var(--surface-2); color:var(--ink-soft); border:none;
    border-radius:18px; padding:8px 14px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .feedback-status{font-size:11.5px; margin-top:7px; color:var(--ink-faint);}
  .feedback-status.err{color:var(--danger); font-weight:700;}
  .fb-done{display:flex; flex-direction:column; gap:4px;}
  .fb-done-title{font-size:14px; font-weight:700; color:var(--success);}
  .fb-done-sub{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}

  form#chatform{
    position:sticky; bottom:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; flex-shrink:0; z-index:5;
  }
  .input-wrap{max-width:100%; width:100%; display:flex; align-items:center; gap:8px; position:relative;}
  .plus-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--surface-2); color:var(--ink-faint); border:none;
    font-size:20px; font-weight:700; flex-shrink:0; cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .plus-btn.open{background:var(--ink); color:var(--surface); transform:rotate(45deg);}
  .plus-menu{
    position:absolute; left:0; bottom:calc(100% + 10px);
    background:var(--surface); border-radius:12px; box-shadow:var(--menu-shadow);
    border:1px solid var(--border); padding:6px; min-width:230px;
    display:none; flex-direction:column; z-index:10;
  }
  .plus-menu.show{display:flex;}
  .plus-menu button{
    display:flex; align-items:center; gap:10px; background:none; border:none;
    text-align:left; padding:10px; border-radius:8px; font-family:inherit;
    font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .plus-menu button:hover{background:var(--surface-2);}
  .plus-menu .ic{
    width:26px; height:26px; border-radius:7px; background:var(--yellow);
    display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
  }
  input[type="text"]{
    flex:1; border:1px solid var(--border); background:var(--input-bg);
    border-radius:20px; padding:10px 16px; outline:none;
    font-family:inherit; font-size:14px; color:var(--ink);
  }
  input[type="text"]:focus{outline:2px solid var(--yellow-dark); outline-offset:1px;}
  button.send{
    width:38px; height:38px; border-radius:50%; background:var(--yellow);
    color:var(--on-yellow); border:none; font-size:16px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  button.send:hover{background:var(--yellow-dark);}
  button.send:focus-visible, .plus-btn:focus-visible, .select-item:focus-visible, .quick-btn:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px;
  }

  @media (prefers-reduced-motion:no-preference){
    .bot-row, .msg-user{animation:rise .16s ease-out;}
  }
  @keyframes rise{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>

<div id="app">
<header>
  <div class="avatar">🌳</div>
  <div class="titles">
    <h1>오리온 용어 나무</h1>
    <div class="sub">질문을 받고 자라는 오리온 용어 나무입니다 :)</div>
  </div>
  <div id="status"><span class="dot"></span><span id="status-text">연결 확인 중...</span></div>
</header>

<main id="thread"></main>

<form id="chatform">
  <div class="input-wrap">
    <button type="button" class="plus-btn" id="plusBtn">+</button>
    <div class="plus-menu" id="plusMenu">
      <button type="button" id="requestUpdateBtn"><span class="ic">📝</span>용어 업데이트 요청</button>
      <button type="button" data-menu-action="top5"><span class="ic">🔥</span>가장 많이 검색한 TOP5</button>
      <button type="button" data-menu-action="recent"><span class="ic">🆕</span>최신 추가 용어</button>
      <button type="button" data-menu-action="categories"><span class="ic">🗂</span>카테고리 보기</button>
      <button type="button" data-menu-action="today"><span class="ic">📅</span>오늘의 용어</button>
      <button type="button" data-menu-action="compare"><span class="ic">⚖</span>헷갈리는 용어 비교</button>
    </div>
    <input id="askInput" type="text" placeholder="예시: RRP가 뭐야?" autocomplete="off">
    <button type="submit" class="send">➤</button>
  </div>
</form>
</div>

<script>
  /* ========================================================
     설정
     ======================================================== */
  const SHEET_ID = "1kA_AZso25Smauk00di0Ehg6-0bRwYcGE5o9FqtM0wlI";
  const SHEET_GID = "0";
  const CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&gid=" + SHEET_GID;
  const FEEDBACK_URL = "https://script.google.com/macros/s/AKfycbwMS03hmR2sv-cHBf9sYZnn9TLgoyLDH6SjSS23qi2d19VkDQ9xr7aujaZrM3TQvm4/exec";
  const REFRESH_INTERVAL_MS = 30000;

  let TERMS = [];

  const thread = document.getElementById("thread");
  const form = document.getElementById("chatform");
  const input = document.getElementById("askInput");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const plusBtn = document.getElementById("plusBtn");
  const plusMenu = document.getElementById("plusMenu");
  const requestUpdateBtn = document.getElementById("requestUpdateBtn");

  /* ========================================================
     혼동하기 쉬운 용어끼리 서로 안내해주는 목록 (수동 큐레이션)
     ======================================================== */
  const RELATED = {
    "순매출": ["출고가 (= 총매출)", "출고매출 (= 순매출)", "실매출 (= POS매출)"],

  // 시트 헤더명: 1단계 = "카테고리1"(없으면 기존 "카테고리"), 2단계 = "카테고리2"
  function normalizeRow(row){
    const c1 = (row["카테고리1"] || row["카테고리"] || "").toString().trim();
    const c2 = (row["카테고리2"] || "").toString().trim();
    return {
      term: (row["용어"] || "").trim(),
      definition: (row["설명"] || "").trim(),
      detail: (row["추가설명"] || "").toString().trim(),
      category: c1 || "기타",
      category2: c2,
      views: Number(row["조회수"]) || 0,
      image: (row["이미지"] || "").toString().trim()
    };
  }

  function catLabel(t){
    return t.category2 ? t.category + " > " + t.category2 : t.category;
  }

  function parseCsv(text){
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    return parsed.data.map(normalizeRow).filter(t => t.term);
  }

  async function refreshTerms(initial){
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const next = parseCsv(text);
      if (!next.length) throw new Error("빈 데이터");
      TERMS = next;
      setStatus("실시간 연동 · 용어 " + TERMS.length + "개", true);
    } catch (err) {
      if (initial) {
        setStatus("연결 실패 · 새로고침 해주세요", false);
      } else {
        console.warn("용어 갱신 실패, 기존 데이터 유지", err);
      }
    }
  }

  /* ========================================================
     검색 로직 — 띄어쓰기 차이 무시 + 유사도 매칭
     (짧은 영문 약어가 다른 단어 안에 우연히 포함돼 오검색되는 문제 방지:
      영문/숫자 질의는 단어경계 정규식으로, 카테고리명은 매칭 대상에서 제외)
     ======================================================== */
  function normalizeForMatch(s){
    return (s || "").toLowerCase().replace(/[\s 　﻿]+/g, "");
  }

  function isLatinQuery(q){
    return /^[a-zA-Z0-9/&().\-_,: ]+$/.test(q);
  }

  function textIncludesWord(text, rawQuery){
    if (!text) return false;
    if (isLatinQuery(rawQuery)){
      const esc = rawQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp("(?<![a-zA-Z0-9])" + esc + "(?![a-zA-Z0-9])", "i");
      return re.test(text);
    }
    return normalizeForMatch(text).includes(normalizeForMatch(rawQuery));
  }

  function levenshtein(a, b){
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++){
      for (let j = 1; j <= b.length; j++){
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[a.length][b.length];
  }

  function similarity(a, b){
    if (!a.length || !b.length) return 0;
    return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
  }

  // ── 영문 약어를 한글 음차(알파벳을 하나씩 한글로 읽은 발음)로도 검색되게 하기 ──
  // 예: "POG" → "피오지", "MD" → "엠디". 새 용어가 추가돼도 자동으로 적용됨.
  const LETTER_KO = {
    A: "에이", B: "비", C: "씨", D: "디", E: "이", F: "에프", G: "지", H: "에이치",
    I: "아이", J: "제이", K: "케이", L: "엘", M: "엠", N: "엔", O: "오", P: "피",
    Q: "큐", R: "알", S: "에스", T: "티", U: "유", V: "브이", W: "더블유", X: "엑스",
    Y: "와이", Z: "지"
  };
  // 알파벳을 글자 그대로 읽지 않고 단어처럼 읽는 관용 발음(예외)
  const PHONETIC_OVERRIDES = {
    "HACCP": ["해썹"],
    "BOM (Bill of Material) (자재 명세서)": ["봄"]
  };

  function extractLatinToken(term){
    const m = term.match(/^[A-Za-z0-9/&-]+/);
    return m ? m[0] : "";
  }

  function spellKorean(token){
    let out = "";
    for (const ch of token.toUpperCase()){
      if (LETTER_KO[ch]) out += LETTER_KO[ch];
    }
    return out;
  }

  function phoneticVariants(t){
    const list = [];
    const spelled = spellKorean(extractLatinToken(t.term));
    if (spelled) list.push(spelled);
    const extra = lookupByName(PHONETIC_OVERRIDES, t.term);
    if (extra) list.push(...extra);
    return list;
  }

  function score(rawQuery, t){
    const q = rawQuery.trim();
    if (!q) return 0;
    const qn = normalizeForMatch(q);
    const nameN = normalizeForMatch(t.term);
    if (!nameN) return 0;
    if (qn === nameN) return 100;
    if (nameN.includes(qn) && qn.length >= 2) return 88;
    if (qn.includes(nameN) && nameN.length >= 2) return 82;

    if (/[가-힣]/.test(q)){
      for (const variant of phoneticVariants(t)){
        const vn = normalizeForMatch(variant);
        if (!vn) continue;
        if (qn === vn) return 97;
        if ((vn.includes(qn) && qn.length >= 2) || (qn.includes(vn) && vn.length >= 2)) return 80;
      }
    }

    if (qn.length >= 2 && textIncludesWord(t.definition + " " + (t.detail || ""), q)) return 55;
    return similarity(qn, nameN) * 50;
  }

  function search(query){
    return TERMS
      .map(t => ({ t, s: score(query, t) }))
      .filter(x => x.s >= 40)
      .sort((a, b) => b.s - a.s);
  }

  function handleQuery(query){
    addUserMsg(query);
    bump("searches");
    const results = search(query);
    if (results.length === 0){
      bump("noMatch");
      addNoMatch(query);
      return;
    }
    const qn = normalizeForMatch(query);
    const exact = results.filter(r => r.s === 100);
    if (exact.length){
      // 이름이 같거나(괄호 앞 이름이 같은: PC(생산)/PC(브랜드)) 용어가 여러 개면 전부 선택지로 보여줌
      const sameBase = results.filter(r => r.s !== 100 && baseName(r.t.term) === qn);
      const group = exact.concat(sameBase);
      if (group.length === 1) addCard(group[0].t);
      else addSelection(query, group.map(r => r.t));
    } else if (results.length === 1){
      addCard(results[0].t);
    } else {
      addSelection(query, results.slice(0, 5).map(r => r.t));
    }
  }

  function baseName(term){
    return normalizeForMatch(term.replace(/\s*[(（].*$/, ""));
  }

  /* ========================================================
     이름이 조금 바뀐 용어도 찾기 (시트에서 "(= 총매출)" → "(총매출)" 처럼 표기를 고쳐도 연결 유지)
     ======================================================== */
  function canonName(s){ return normalizeForMatch((s || "").replace(/=/g, "")); }

  function lookupByName(map, name){
    if (map[name]) return map[name];
    const c = canonName(name);
    const keys = Object.keys(map);
    for (const k of keys) if (canonName(k) === c) return map[k];
    const b = baseName(name);
    const same = keys.filter(k => baseName(k) === b);
    return same.length === 1 ? map[same[0]] : null;
  }

  function findTermByName(name){
    let t = TERMS.find(x => x.term === name);
    if (t) return t;
    const c = canonName(name);
    t = TERMS.find(x => canonName(x.term) === c);
    if (t) return t;
    const b = baseName(name);
    const cands = TERMS.filter(x => baseName(x.term) === b);
    return cands.length === 1 ? cands[0] : null;
  }

  /* ========================================================

     ======================================================== */
  function kstDateStr(){
    try { return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" }); }
    catch (e) { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
  }
  function hash32(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function pickTodayTerm(day){
    let best = null, bestH = Infinity;
    TERMS.forEach(t => {
      if (!t.definition) return;
      const h = hash32(day + "|" + t.term);
      if (h < bestH){ bestH = h; best = t; }
    });
    return best;
  }

  const PAGE_SIZE = 15;

  function choiceList(promptText, items, opts){
    const pinned = !!(opts && opts.pinned);
    const wrap = document.createElement("div");
    wrap.className = "select-bubble";
    const head = document.createElement("div");
    head.className = "select-head";

    toggle.textContent = "접기 ▲";
    if (!pinned) head.appendChild(toggle);
    wrap.appendChild(head);

    const list = document.createElement("div");
    list.className = "select-list";

    function setCollapsed(collapsed){
      list.classList.toggle("collapsed", collapsed);
      toggle.textContent = collapsed ? "펼치기 ▼" : "접기 ▲";
    }
    toggle.addEventListener("click", () => setCollapsed(!list.classList.contains("collapsed")));

    let shown = 0;
    let moreBtn = null;
    // 15개를 조금 넘는 정도(18개까지)면 "1개 남음" 같은 어색한 더 보기 없이 전부 보여줌
    const firstSize = items.length <= PAGE_SIZE + 3 ? items.length : PAGE_SIZE;
    function renderMore(){
      if (moreBtn){ moreBtn.remove(); moreBtn = null; }
      const size = shown === 0 ? firstSize : PAGE_SIZE;
      items.slice(shown, shown + size).forEach(it => {
        const btn = document.createElement("button");

          it.onClick();
        });
        list.appendChild(btn);
      });
      shown = Math.min(shown + size, items.length);
      if (shown < items.length){
        moreBtn = document.createElement("button");
        moreBtn.type = "button";
        moreBtn.className = "select-more";
        moreBtn.textContent = "더 보기 (" + (items.length - shown) + "개 남음)";
        moreBtn.addEventListener("click", renderMore);
        list.appendChild(moreBtn);
      }
    }
    renderMore();

    wrap.appendChild(list);
    botRow(wrap);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

    const group = TERMS.filter(t => t.category === cat);
    const subs = [...new Set(group.map(t => t.category2).filter(Boolean))];
    const items = subs.map(sub => {
      const n = group.filter(t => t.category2 === sub).length;
      return { label: sub, badge: n + "개", onClick: () => showCategoryTerms(cat, sub) };

    const noSub = group.filter(t => !t.category2).length;
    if (noSub) items.push({ label: "(세부 분류 없음)", badge: noSub + "개", onClick: () => showCategoryTerms(cat, "") });
    choiceList("📂 \"" + cat + "\"의 세부 카테고리를 골라주세요", items);
  }

  function showCategoryTerms(cat, sub){
    const list = TERMS.filter(t => t.category === cat &&
      (sub === null || sub === undefined ? true : (t.category2 || "") === sub));
    const title = cat + (sub ? " > " + sub : "");

  function mainScrolls(){ return thread.scrollHeight > thread.clientHeight + 2; }
  function distFromBottom(){
    if (mainScrolls()) return thread.scrollHeight - thread.scrollTop - thread.clientHeight;
    const de = document.documentElement;
    return de.scrollHeight - window.scrollY - window.innerHeight;
  }
  function updateJumpBtn(){ jumpBtn.classList.toggle("show", distFromBottom() > 200); }
  jumpBtn.addEventListener("click", () => {
    if (mainScrolls()) thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" });
    else window.scrollTo({ top: document.documentElement.scrollHeight, behavior: "smooth" });
  });
  thread.addEventListener("scroll", updateJumpBtn, { passive: true });
  window.addEventListener("scroll", updateJumpBtn, { passive: true });
  window.addEventListener("resize", updateJumpBtn);
  new MutationObserver(() => setTimeout(updateJumpBtn, 400)).observe(thread, { childList: true, subtree: true });
  // + 메뉴가 열려 있을 땐 버튼이 가리지 않게 숨김
  new MutationObserver(() => document.body.classList.toggle("menu-open", plusMenu.classList.contains("show")))
    .observe(plusMenu, { attributes: true, attributeFilter: ["class"] });

  /* ========================================================
     + 버튼 드롭다운
     ======================================================== */
  plusBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = plusMenu.classList.toggle("show");
    plusBtn.classList.toggle("open", isOpen);
  });
  document.addEventListener("click", (e) => {
    if (!plusMenu.contains(e.target) && e.target !== plusBtn){
      plusMenu.classList.remove("show");
      plusBtn.classList.remove("open");
    }
  });
  requestUpdateBtn.addEventListener("click", () => {
    plusMenu.classList.remove("show");
    plusBtn.classList.remove("open");
    openFeedbackForm(input.value.trim(), "업데이트 요청");
  });
  plusMenu.querySelectorAll("[data-menu-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      plusMenu.classList.remove("show");
      plusBtn.classList.remove("open");
      handleQuickAction(btn.dataset.menuAction);
    });
  });

  /* ========================================================
     피드백(용어 등록/수정/업데이트 요청)
     ======================================================== */
  function openFeedbackForm(termName, mode){
    const titleMap = {
      "신규 등록": "📝 용어 등록 요청",
      "수정": "✏️ 용어 수정 요청",
      "업데이트 요청": "🔄 용어 업데이트 요청"
    };
    const card = document.createElement("div");
    card.className = "feedback-card";

    const h3 = document.createElement("h3");
    h3.textContent = titleMap[mode] || "📝 용어 업데이트 요청";
    card.appendChild(h3);

    const termLabel = document.createElement("label");
    termLabel.textContent = "용어명";
    card.appendChild(termLabel);
    const termInput = document.createElement("input");
    termInput.type = "text";
    termInput.className = "fb-term";
    termInput.placeholder = "예: POG";
    termInput.value = termName || "";
    card.appendChild(termInput);

    const msgLabel = document.createElement("label");
    msgLabel.textContent = "요청 내용";
    card.appendChild(msgLabel);
    const msgInput = document.createElement("textarea");
    msgInput.className = "fb-message";
    msgInput.placeholder = "추가하거나 수정하고 싶은 내용을 적어주세요";
    card.appendChild(msgInput);

    const reqLabel = document.createElement("label");
    reqLabel.textContent = "이름 / 부서 (선택)";
    card.appendChild(reqLabel);
    const reqInput = document.createElement("input");
    reqInput.type = "text";
    reqInput.className = "fb-requester";
    reqInput.placeholder = "예: 홍길동 / 마케팅팀";
    card.appendChild(reqInput);

    const actions = document.createElement("div");
    actions.className = "feedback-actions";
    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "btn-request fb-submit";
    submitBtn.textContent = "요청 보내기";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "btn-cancel";
    cancelBtn.textContent = "취소";
    actions.appendChild(submitBtn);
    actions.appendChild(cancelBtn);
    card.appendChild(actions);

    const statusDiv = document.createElement("div");
    statusDiv.className = "feedback-status";
    card.appendChild(statusDiv);

    const row = botRow(card);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

    cancelBtn.addEventListener("click", () => row.remove());
    submitBtn.addEventListener("click", () => submitFeedback(card));
  }

  async function submitFeedback(card){
    const term = card.querySelector(".fb-term").value.trim();
    const message = card.querySelector(".fb-message").value.trim();
    const requester = card.querySelector(".fb-requester").value.trim() || "익명";
    const statusEl2 = card.querySelector(".feedback-status");

    if (!term){
      statusEl2.textContent = "용어명을 입력해주세요.";
      statusEl2.className = "feedback-status err";
      return;
    }
    statusEl2.textContent = "전송 중...";
    statusEl2.className = "feedback-status";

    try {
      const res = await fetch(FEEDBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ term, message, requester })
      });
      const result = await res.json();
      if (!res.ok || !result.ok) {
        throw new Error(result.error || ("서버 응답 오류 (" + res.status + ")"));
      }
      card.innerHTML = "";
      const done = document.createElement("div");
      done.className = "fb-done";
      const t1 = document.createElement("span");
      t1.className = "fb-done-title";
      t1.textContent = "✅ 요청 완료";
      const t2 = document.createElement("span");
      t2.className = "fb-done-sub";
      t2.textContent = "\"" + term + "\" 요청이 접수됐어요. 검토 후 반영해드릴게요!";
      done.appendChild(t1);
      done.appendChild(t2);
      card.appendChild(done);
      bump("requests");
    } catch (err) {
      statusEl2.textContent = "전송 실패: " + (err && err.message ? err.message : "잠시 후 다시 시도해주세요.");
      statusEl2.className = "feedback-status err";
    }
  }

  /* ========================================================
     사용 로그 (익명) + 👍/👎
     - 개인 식별 정보는 수집하지 않음(랜덤 ID, 기기/브라우저 종류, 이용 횟수)
     - localhost 에서는 전송하지 않음, ?admin=1 로 한 번 접속한 브라우저는 "관리자"로 표시(대시보드 제외)
     ======================================================== */
  const LOG_PARAMS = new URLSearchParams(location.search);
  const LOG_LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname);
  const LOG_ENABLED = !LOG_LOCAL || LOG_PARAMS.has("logtest");
  const SESSION_GAP_MS = 30 * 60 * 1000;

  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch (e) {} }
  function ssGet(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} }
  function newId(){
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
  }

  if (LOG_PARAMS.get("admin") === "1") lsSet("ot_admin", "1");
  if (LOG_PARAMS.get("admin") === "0") lsDel("ot_admin");
  const IS_ADMIN = lsGet("ot_admin") === "1";

  function detectEnv(){
    const ua = navigator.userAgent || "";
    const touch = (navigator.maxTouchPoints || 0) > 1;
    const isIPadOS = /Macintosh/.test(ua) && touch;
    let device = "PC";
    if (/iPad|Tablet|PlayBook|Silk/i.test(ua) || isIPadOS || (/Android/i.test(ua) && !/Mobile/i.test(ua))) device = "태블릿";
    else if (/iPhone|iPod|Android|Mobile|Windows Phone/i.test(ua)) device = "모바일";
    let os = "기타";
    if (/iPhone|iPad|iPod/i.test(ua) || isIPadOS) os = "iOS";
    else if (/Android/i.test(ua)) os = "Android";
    else if (/Windows/i.test(ua)) os = "Windows";
    else if (/Mac OS X|Macintosh/i.test(ua)) os = "macOS";
    else if (/CrOS/i.test(ua)) os = "ChromeOS";
    else if (/Linux/i.test(ua)) os = "Linux";
    let browser = "기타";
    if (/KAKAOTALK/i.test(ua)) browser = "카카오톡 인앱";
    else if (/NAVER\(/.test(ua)) browser = "네이버 인앱";
    else if (/Teams\//i.test(ua)) browser = "Teams";
    else if (/Edg(e|A|iOS)?\//.test(ua)) browser = "Edge";
    else if (/Whale\//i.test(ua)) browser = "Whale";
    else if (/SamsungBrowser/i.test(ua)) browser = "Samsung Internet";
    else if (/Firefox|FxiOS/i.test(ua)) browser = "Firefox";
    else if (/Chrome|CriOS/i.test(ua)) browser = "Chrome";
    else if (/Safari/i.test(ua)) browser = "Safari";
    return { device, os, browser, screenW: window.innerWidth };
  }

  const ENV = detectEnv();
  const usage = { sid: "", vid: "", start: 0, last: 0, visitType: "", lastSent: "", c: {} };
  function zeroCounts(){ return { searches: 0, noMatch: 0, termViews: 0, quick: 0, requests: 0, ratings: 0 }; }

  function sendLog(payload){
    if (!LOG_ENABLED) return;
    const body = JSON.stringify(payload);
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(FEEDBACK_URL, new Blob([body], { type: "text/plain;charset=UTF-8" }))) return;
    } catch (e) {}
    try {
      fetch(FEEDBACK_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: true }).catch(() => {});
    } catch (e) {}
  }

  function basePayload(action){
    return Object.assign({ action, sessionId: usage.sid, visitorId: usage.vid, admin: IS_ADMIN ? "Y" : "" }, ENV, { visitType: usage.visitType });
  }
  function saveSession(){
    ssSet("ot_sess", JSON.stringify({ sid: usage.sid, start: usage.start, last: usage.last, visitType: usage.visitType, c: usage.c }));
  }
  function touch(){ usage.last = Date.now(); }
  function bump(key){
    usage.c[key] = (usage.c[key] || 0) + 1;
    touch();
    saveSession();
  }

  function startSession(){
    const now = Date.now();
    usage.vid = lsGet("ot_vid") || newId();
    lsSet("ot_vid", usage.vid);
    const seenBefore = !!lsGet("ot_first");
    usage.visitType = seenBefore ? "재방문" : "신규";
    if (!seenBefore) lsSet("ot_first", String(now));
    usage.sid = newId();
    usage.start = now;
    usage.last = now;
    usage.c = zeroCounts();
    usage.lastSent = "";
    saveSession();
    sendLog(basePayload("visit"));
  }

  function initUsage(){
    let prev = null;
    try { const raw = ssGet("ot_sess"); prev = raw ? JSON.parse(raw) : null; } catch (e) {}
    if (prev && prev.sid && Date.now() - prev.last < SESSION_GAP_MS){
      usage.vid = lsGet("ot_vid") || newId();
      lsSet("ot_vid", usage.vid);
      usage.sid = prev.sid;
      usage.start = prev.start;
      usage.last = Date.now();
      usage.visitType = prev.visitType || "재방문";
      usage.c = Object.assign(zeroCounts(), prev.c || {});
    } else {
      startSession();
    }
    ["click", "keydown", "touchstart", "scroll"].forEach(ev =>
      window.addEventListener(ev, touch, { passive: true, capture: true }));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") flushSession();
      else if (Date.now() - usage.last > SESSION_GAP_MS) startSession();
      else touch();
    });
    window.addEventListener("pagehide", flushSession);
  }

  function flushSession(){
    const dur = Math.max(0, Math.round((usage.last - usage.start) / 1000));
    const p = Object.assign(basePayload("session"), {
      duration: dur, searches: usage.c.searches, noMatch: usage.c.noMatch, termViews: usage.c.termViews,
      quick: usage.c.quick, requests: usage.c.requests, ratings: usage.c.ratings
    });
    const key = JSON.stringify([p.sessionId, p.duration, p.searches, p.noMatch, p.termViews, p.quick, p.requests, p.ratings]);
    if (key === usage.lastSent) return;
    usage.lastSent = key;
    saveSession();
    sendLog(p);
  }

  function buildRatingRow(t){
    const row = document.createElement("div");
    row.className = "rate-row";
    const q = document.createElement("span");
    q.textContent = "도움이 되었나요?";
    row.appendChild(q);
    const mk = (emoji, label, value) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "rate-btn";
      b.textContent = emoji;
      b.setAttribute("aria-label", label);
      b.addEventListener("click", () => submitRating(t, value, row));
      return b;
    };
    row.appendChild(mk("👍", "도움이 됐어요", "좋음"));
    row.appendChild(mk("👎", "아쉬워요", "아쉬움"));
    return row;
  }

  function submitRating(t, value, row){
    sendLog(Object.assign(basePayload("rating"), { term: t.term, category: catLabel(t), rating: value }));
    bump("ratings");
    row.innerHTML = "";
    const msg = document.createElement("span");
    msg.className = "rate-thanks";
    if (value === "좋음"){
      msg.textContent = "감사합니다! 🙌";
      row.appendChild(msg);
    } else {
      msg.textContent = "아쉬움을 남겨주셔서 감사해요.";
      row.appendChild(msg);
      const fix = document.createElement("button");
      fix.type = "button";
      fix.className = "rate-fix";
      fix.textContent = "수정 요청하기";
      fix.addEventListener("click", () => openFeedbackForm(t.term, "수정"));
      row.appendChild(fix);
    }
  }

  /* ========================================================
     시작
     ======================================================== */
  initUsage();
  addWelcomeMessage();
  addQuickActions();
  refreshTerms(true);
  setInterval(() => refreshTerms(false), REFRESH_INTERVAL_MS);
</script>
</body>
