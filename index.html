<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오리온 용어 나무</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%B3</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --yellow:#FEE500;
    --yellow-dark:#F5D900;
    --on-yellow:#3C1E1E;
    --ink:#3C1E1E;
    --ink-soft:#664242;
    --ink-faint:#9C8181;
    --room-bg:#ABC4D6;
    --room-bg2:#B7CFDF;
    --app-bg:#DDE3E8;
    --surface:#FFFFFF;
    --surface-2:#F7F7F7;
    --input-bg:#F2F2F2;
    --border:#E4E4E4;
    --danger:#D0492A;
    --success:#2E9E5B;
    --extra-bg:#FFF6D9;
    --extra-label-ink:#A8860A;
    --link-ink:#8A8A8A;
    --select-bg:#F7F7F7;
    --select-border:#ECECEC;
    --select-hover:#EFEFEF;
    --select-viewed-bg:#FFFDF0;
    --select-request-border:#C9C2A8;
    --select-request-ink:#8A8578;
    --time-ink:#5B6B78;
    --shadow:0 1px 1px rgba(0,0,0,.05);
    --menu-shadow:0 4px 18px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    font-family:"Noto Sans KR", system-ui, sans-serif;
    color:var(--ink);
    background:var(--app-bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  #app{
    width:100%;
    max-width:720px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--room-bg);
    position:relative;
  }
  @media (min-width:760px){
    body{padding:28px 16px;}
    #app{
      min-height:calc(100vh - 56px);
      max-height:calc(100vh - 56px);
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 12px 40px rgba(0,0,0,.22);
    }
  }

  header{
    background:var(--yellow);
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 0 rgba(0,0,0,.06);
    position:sticky;
    top:0;
    z-index:5;
    flex-shrink:0;
  }
  header .avatar{
    width:38px; height:38px; border-radius:11px;
    background:var(--on-yellow);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
  }
  header .titles{flex:1; min-width:0;}
  header h1{font-size:16px; font-weight:700; margin:0; color:var(--on-yellow); font-family:"Noto Serif KR", serif;}
  header .sub{
    font-size:11.5px; color:var(--on-yellow); opacity:.72; margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #status{
    display:flex; align-items:center; gap:5px;
    font-size:10.5px; color:var(--on-yellow); opacity:.85;
    flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums;
  }
  #status .dot{width:6px; height:6px; border-radius:50%; background:#B7A400; flex-shrink:0;}
  #status.live .dot{background:#2E9E5B;}
  @media (max-width:420px){
    #status span:last-child{display:none;}
  }

  main{
    flex:1; overflow-y:auto;
    padding:16px 12px 20px;
    display:flex; flex-direction:column; gap:2px;
    background:
      radial-gradient(circle at 20% 10%, var(--room-bg2) 0%, transparent 40%),
      var(--room-bg);
  }

  /* ── 말풍선 공통 ── */
  .bot-row{display:flex; align-items:flex-end; gap:8px; margin:10px 0 2px; max-width:88%;}
  .bot-avatar{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:var(--on-yellow); color:var(--yellow);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .bot-col{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .bot-name{font-size:11px; color:var(--ink-soft); margin-left:2px;}
  .bubble-wrap{display:flex; align-items:flex-end; gap:6px;}
  .time{font-size:10px; color:var(--time-ink); white-space:nowrap; flex-shrink:0;}

  .bubble-bot{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;
    padding:10px 13px;
    font-size:14px;
    line-height:1.55;
    box-shadow:var(--shadow);
    max-width:100%;
  }
  .msg-user{
    align-self:flex-end;
    display:flex; align-items:flex-end; gap:6px;
    margin:10px 0 2px; max-width:88%;
  }
  .bubble-user{
    background:var(--yellow);
    color:var(--on-yellow);
    border-radius:14px 4px 14px 14px;
    padding:10px 13px;
    font-size:14px;
    line-height:1.5;
    box-shadow:var(--shadow);
  }

  /* ── 웰컴 메시지 ── */
  .welcome-bubble{max-width:320px; white-space:pre-line; font-size:13.5px; line-height:1.65;}

  /* ── 퀵 액션 버튼 ── */
  .quick-actions{display:flex; flex-wrap:wrap; gap:8px; max-width:320px; margin:2px 0 14px 42px;}
  .quick-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:11px 12px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink);
    cursor:pointer; box-shadow:var(--shadow); text-align:center;
  }
  .quick-btn:hover{background:var(--surface-2);}
  .quick-btn:active{transform:scale(.98);}
  @media (max-width:420px){ .quick-actions{margin-left:0; max-width:100%;} }

  /* ── 용어 카드(리치 메시지) ── */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;
    overflow:hidden;
    box-shadow:var(--shadow);
    width:100%;
    max-width:320px;
  }
  .card .cat-tag{
    display:inline-block; font-size:10.5px; font-weight:700; color:var(--on-yellow);
    background:var(--yellow); padding:3px 9px; border-radius:0 0 8px 0;
  }
  .card .body{padding:12px 14px 14px;}
  .card .term{font-size:16.5px; font-weight:700; margin:6px 0 5px; color:var(--ink); font-family:"Noto Serif KR", serif;}
  .card .def{font-size:13.5px; line-height:1.55; color:var(--ink); margin:0 0 9px; white-space:pre-line;}
  .extra-box{
    background:var(--extra-bg); border-left:3px solid var(--yellow-dark); border-radius:4px;
    padding:8px 10px; margin:0 0 10px; font-size:12.5px; line-height:1.6;
    color:var(--ink-soft); white-space:pre-line;
  }
  .extra-box .extra-label{display:block; font-size:10.5px; font-weight:700; color:var(--extra-label-ink); margin-bottom:3px;}
  .request-link{
    background:none; border:none; padding:0; font-size:11.5px; color:var(--link-ink);
    text-decoration:underline; cursor:pointer; font-family:inherit;
  }
  .request-link:hover{color:var(--ink-soft);}
  .btn-request{
    background:var(--yellow); color:var(--on-yellow); border:none; border-radius:18px;
    padding:9px 16px; font-family:inherit; font-weight:700; font-size:12.5px;
    cursor:pointer; align-self:flex-start;
  }
  .btn-request:hover{background:var(--yellow-dark);}

  /* ── 선택지 목록 (여러 후보 / TOP5 / 최신 / 카테고리) ── */
  .select-bubble{display:flex; flex-direction:column; gap:8px; max-width:300px;}
  .select-prompt{margin:0; font-size:14px;}
  .select-list{display:flex; flex-direction:column; gap:6px;}
  .select-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--select-bg); border:1px solid var(--select-border); border-radius:9px;
    padding:9px 12px; font-family:inherit; font-size:13px; font-weight:500; color:var(--ink);
    cursor:pointer; text-align:left;
  }
  .select-item:hover{background:var(--select-hover);}
  .select-item.viewed{border-color:var(--yellow-dark); background:var(--select-viewed-bg);}
  .select-item .select-cat{
    font-size:10.5px; font-weight:700; color:var(--ink-soft); background:var(--yellow);
    padding:2px 7px; border-radius:8px; flex-shrink:0;
  }
  .select-item-request{
    background:#fff; border:1px dashed var(--select-request-border); color:var(--select-request-ink);
    justify-content:center;
  }
  .select-item-request:hover{background:#FBFAF5;}
  .no-match-wrap{display:flex; flex-direction:column; gap:10px; align-items:flex-start; padding:11px 14px; max-width:300px;}

  /* ── 피드백 폼 카드 ── */
  .feedback-card{background:var(--surface); padding:14px 16px; width:100%; max-width:300px;}
  .feedback-card h3{font-size:14px; font-weight:700; margin:0 0 8px; color:var(--ink);}
  .feedback-card label{display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin:9px 0 4px;}
  .feedback-card input, .feedback-card textarea{
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-family:inherit; font-size:13px;
    resize:vertical; background:var(--input-bg); color:var(--ink);
  }
  .feedback-card input:focus, .feedback-card textarea:focus{outline:2px solid var(--yellow-dark); outline-offset:1px;}
  .feedback-card textarea{min-height:60px;}
  .feedback-actions{display:flex; gap:8px; margin-top:11px;}
  .btn-cancel{
    background:var(--surface-2); color:var(--ink-soft); border:none;
    border-radius:18px; padding:8px 14px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .feedback-status{font-size:11.5px; margin-top:7px; color:var(--ink-faint);}
  .feedback-status.err{color:var(--danger); font-weight:700;}
  .fb-done{display:flex; flex-direction:column; gap:4px;}
  .fb-done-title{font-size:14px; font-weight:700; color:var(--success);}
  .fb-done-sub{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}

  form#chatform{
    position:sticky; bottom:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; flex-shrink:0; z-index:5;
  }
  .input-wrap{max-width:100%; width:100%; display:flex; align-items:center; gap:8px; position:relative;}
  .plus-btn{
    width:34px; height:34px; border-radius:50%;
    background:var(--surface-2); color:var(--ink-faint); border:none;
    font-size:20px; font-weight:700; flex-shrink:0; cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .plus-btn.open{background:var(--ink); color:var(--surface); transform:rotate(45deg);}
  .plus-menu{
    position:absolute; left:0; bottom:calc(100% + 10px);
    background:var(--surface); border-radius:12px; box-shadow:var(--menu-shadow);
    border:1px solid var(--border); padding:6px; min-width:190px;
    display:none; flex-direction:column; z-index:10;
  }
  .plus-menu.show{display:flex;}
  .plus-menu button{
    display:flex; align-items:center; gap:10px; background:none; border:none;
    text-align:left; padding:10px; border-radius:8px; font-family:inherit;
    font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .plus-menu button:hover{background:var(--surface-2);}
  .plus-menu .ic{
    width:26px; height:26px; border-radius:7px; background:var(--yellow);
    display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;
  }
  input[type="text"]{
    flex:1; border:1px solid var(--border); background:var(--input-bg);
    border-radius:20px; padding:10px 16px; outline:none;
    font-family:inherit; font-size:14px; color:var(--ink);
  }
  input[type="text"]:focus{outline:2px solid var(--yellow-dark); outline-offset:1px;}
  button.send{
    width:38px; height:38px; border-radius:50%; background:var(--yellow);
    color:var(--on-yellow); border:none; font-size:16px; cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  button.send:hover{background:var(--yellow-dark);}
  button.send:focus-visible, .plus-btn:focus-visible, .select-item:focus-visible, .quick-btn:focus-visible{
    outline:2px solid var(--ink); outline-offset:2px;
  }

  @media (prefers-reduced-motion:no-preference){
    .bot-row, .msg-user{animation:rise .16s ease-out;}
  }
  @keyframes rise{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>

<div id="app">
<header>
  <div class="avatar">🌳</div>
  <div class="titles">
    <h1>오리온 용어 나무</h1>
    <div class="sub">질문을 받고 자라는 오리온 용어 나무입니다 :)</div>
  </div>
  <div id="status"><span class="dot"></span><span id="status-text">연결 확인 중...</span></div>
</header>

<main id="thread"></main>

<form id="chatform">
  <div class="input-wrap">
    <button type="button" class="plus-btn" id="plusBtn">+</button>
    <div class="plus-menu" id="plusMenu">
      <button type="button" id="requestUpdateBtn"><span class="ic">📝</span>용어 업데이트 요청</button>
    </div>
    <input id="askInput" type="text" placeholder="예: POG가 뭐야?" autocomplete="off">
    <button type="submit" class="send">➤</button>
  </div>
</form>
</div>

  async function refreshTerms(initial){
    try {
      const res = await fetch(CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const next = parseCsv(text);
      if (!next.length) throw new Error("빈 데이터");
      TERMS = next;
      setStatus("실시간 연동 · 용어 " + TERMS.length + "개", true);
    } catch (err) {
      if (initial) {
        setStatus("연결 실패 · 새로고침 해주세요", false);
      } else {
        console.warn("용어 갱신 실패, 기존 데이터 유지", err);
      }
    }
  }

  /* ========================================================
     검색 로직 — 띄어쓰기 차이 무시 + 유사도 매칭
     (짧은 영문 약어가 다른 단어 안에 우연히 포함돼 오검색되는 문제 방지:
      영문/숫자 질의는 단어경계 정규식으로, 카테고리명은 매칭 대상에서 제외)
     ======================================================== */
  function normalizeForMatch(s){
    return (s || "").toLowerCase().replace(/[\s 　﻿]+/g, "");
  }

  function isLatinQuery(q){
    return /^[a-zA-Z0-9/&().\-_,: ]+$/.test(q);
  }

  function textIncludesWord(text, rawQuery){
    if (!text) return false;
    if (isLatinQuery(rawQuery)){
      const esc = rawQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const re = new RegExp("(?<![a-zA-Z0-9])" + esc + "(?![a-zA-Z0-9])", "i");
      return re.test(text);
    }
    return normalizeForMatch(text).includes(normalizeForMatch(rawQuery));
  }

  function levenshtein(a, b){
    const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++){
      for (let j = 1; j <= b.length; j++){
        dp[i][j] = a[i - 1] === b[j - 1]
          ? dp[i - 1][j - 1]
          : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
      }
    }
    return dp[a.length][b.length];
  }

  function similarity(a, b){
    if (!a.length || !b.length) return 0;
    return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
  }

  function score(rawQuery, t){
    const q = rawQuery.trim();
    if (!q) return 0;
    const qn = normalizeForMatch(q);
    const nameN = normalizeForMatch(t.term);
    if (!nameN) return 0;
    if (qn === nameN) return 100;
    if (nameN.includes(qn) && qn.length >= 2) return 88;
    if (qn.includes(nameN) && nameN.length >= 2) return 82;
    if (qn.length >= 2 && textIncludesWord(t.definition + " " + (t.detail || ""), q)) return 55;
    return similarity(qn, nameN) * 50;
  }

  function search(query){
    return TERMS
      .map(t => ({ t, s: score(query, t) }))
      .filter(x => x.s >= 40)
      .sort((a, b) => b.s - a.s);
  }

  function handleQuery(query){
    addUserMsg(query);
    const results = search(query);
    if (results.length === 0){
      addNoMatch(query);
    } else if (results.length === 1 || results[0].s === 100){
      addCard(results[0].t);
    } else {
      addSelection(query, results.slice(0, 3).map(r => r.t));
    }
  }

    cancelBtn.type = "button";
    cancelBtn.className = "btn-cancel";
    cancelBtn.textContent = "취소";
    actions.appendChild(submitBtn);
    actions.appendChild(cancelBtn);
    card.appendChild(actions);

    const statusDiv = document.createElement("div");
    statusDiv.className = "feedback-status";
    card.appendChild(statusDiv);

    const row = botRow(card);
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

    cancelBtn.addEventListener("click", () => row.remove());
    submitBtn.addEventListener("click", () => submitFeedback(card));
  }

  async function submitFeedback(card){
    const term = card.querySelector(".fb-term").value.trim();
    const message = card.querySelector(".fb-message").value.trim();
    const requester = card.querySelector(".fb-requester").value.trim() || "익명";
    const statusEl2 = card.querySelector(".feedback-status");

    if (!term){
      statusEl2.textContent = "용어명을 입력해주세요.";
      statusEl2.className = "feedback-status err";
      return;
    }
    statusEl2.textContent = "전송 중...";
    statusEl2.className = "feedback-status";

    try {
      const res = await fetch(FEEDBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ term, message, requester })
      });
      const result = await res.json();
      if (!res.ok || !result.ok) {
        throw new Error(result.error || ("서버 응답 오류 (" + res.status + ")"));
      }
      card.innerHTML = "";
      const done = document.createElement("div");
      done.className = "fb-done";
      const t1 = document.createElement("span");
      t1.className = "fb-done-title";
      t1.textContent = "✅ 요청 완료";
      const t2 = document.createElement("span");
      t2.className = "fb-done-sub";
      t2.textContent = "\"" + term + "\" 요청이 접수됐어요. 검토 후 반영해드릴게요!";
      done.appendChild(t1);
      done.appendChild(t2);
      card.appendChild(done);
    } catch (err) {
      statusEl2.textContent = "전송 실패: " + (err && err.message ? err.message : "잠시 후 다시 시도해주세요.");
      statusEl2.className = "feedback-status err";
    }
  }

  /* ========================================================
     시작
     ======================================================== */
  addWelcomeMessage();
  addQuickActions();
  refreshTerms(true);
  setInterval(() => refreshTerms(false), REFRESH_INTERVAL_MS);
</script>
</body>
</html>
